[project]
name = "model-evaluation"
version = "0.1.0"
description = "Compare the models of the assistant with MLflow"
readme = "README.md"
authors = [
    { name = "Baptiste Darnala", email = "darnala.b@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "conversation-engine",
    "jiwer>=4.0.0",
    "mlflow>=3.17.2",
    "python-dotenv>=1.2.4",
    "soundfile>=0.14.0",
]

[project.scripts]
evaluate-stt = "model_evaluation.stt.evaluate_stt:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
conversation-engine = { workspace = true }
