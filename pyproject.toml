[project]
name = "ai-language-learning-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "conversation-engine",
    "front",
]

[tool.uv.workspace]
members = [
    "conversation-engine",
    "front",
]

[tool.uv.sources]
conversation-engine = { workspace = true }
front = { workspace = true }

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "D",
]
ignore = [
    "E501",
    "D203",
    "D213",
    "D100",
    "D104",
]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.1",
]

[tool.ruff.lint.per-file-ignores]
"conversation-engine/run_server.py" = ["E402"]
